name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/futuristic-3d-portfolio-fj2f0l
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: MY-3D-Project1/package-lock.json
      - name: Install dependencies
        working-directory: MY-3D-Project1
        run: npm ci
      - name: Build
        working-directory: MY-3D-Project1
        run: npm run build
      - uses: actions/configure-pages@v4
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: MY-3D-Project1/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
